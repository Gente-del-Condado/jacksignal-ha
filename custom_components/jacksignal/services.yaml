speak_sensor:
  fields:
    sensor:
      required: true
      selector:
        entity:
          domain:
            - sensor
            - binary_sensor
play_sound:
  fields:
    sound:
      required: true
      selector:
        media:
          accept:
            - audio/*
    priority:
      default: normal
      selector:
        select:
          translation_key: priority
          options:
            - low
            - normal
            - high
            - critical
