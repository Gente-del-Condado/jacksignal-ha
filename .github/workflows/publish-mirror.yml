name: Publicar aplicación desde espejo privado
'on':
  schedule:
  - cron: 11 * * * *
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: public-app-mirror
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.ref == 'refs/heads/main' && vars.ENABLE_MIRROR_PUBLICATION == 'true'
    outputs:
      repo: ${{ steps.plan.outputs.repo }}
      sha: ${{ steps.plan.outputs.sha }}
      changed: ${{ steps.plan.outputs.changed }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - id: plan
      name: Consultar el espejo privado sin ejecutar sus fuentes
      env:
        MIRROR_READ_TOKEN: ${{ secrets.MIRROR_READ_TOKEN }}
      run: python3 .github/ha-images/public_app.py plan
  quality:
    needs: plan
    if: needs.plan.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Descargar el SHA exacto del espejo
      env:
        MIRROR_READ_TOKEN: ${{ secrets.MIRROR_READ_TOKEN }}
        SOURCE_SHA: ${{ needs.plan.outputs.sha }}
      run: python3 .github/ha-images/public_app.py download --sha "$SOURCE_SHA" --source "$RUNNER_TEMP/source"
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: ${{ needs.plan.outputs.repo == 'pivigia' && '3.12' || '3.14' }}
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      if: needs.plan.outputs.repo == 'jacksignal'
      with:
        node-version: '22'
    - name: Comprobar PiVigia sin credenciales
      if: needs.plan.outputs.repo == 'pivigia'
      working-directory: ${{ runner.temp }}/source
      run: 'set -euo pipefail

        python -m pip install pip-audit==2.10.1

        python -m pip_audit --disable-pip --no-deps -r requirements.lock

        python -m pip install -r requirements.lock

        python -m pip install -e ''.[dev]''

        python scripts/download_model.py

        ruff check src tests scripts custom_components

        pytest -q

        python scripts/sync_addon.py --check

        python scripts/i18n.py --check

        python scripts/sync_yunohost.py --check

        python scripts/release.py --check

        python -m pip install -r docs/requirements.txt

        mkdocs build --strict

        python scripts/check_manual.py

        sudo apt-get update -qq

        sudo apt-get install -y shellcheck

        shellcheck -s bash -e SC1091,SC2154 packaging/yunohost/scripts/* packaging/yunohost/conf/certificate-hook

        docker build -t pivigia:quality .

        docker build -t pivigia-addon:quality addons/pivigia

        '
    - name: Comprobar JackSignal sin credenciales
      if: needs.plan.outputs.repo == 'jacksignal'
      working-directory: ${{ runner.temp }}/source
      run: 'set -euo pipefail

        sudo apt-get update -qq

        sudo apt-get install -y libpulse0 ffmpeg rsync

        python -m pip install -r requirements-test.txt pip-audit==2.10.1

        python -m pip check

        python -m pip_audit

        bash -n scripts/publish-ha.sh scripts/publish-store.sh

        python -m unittest discover -s tests -v

        node --test tests/test_panel_frontend.cjs

        '
    - name: Exportar solo archivos publicables sin credenciales
      run: python3 .github/ha-images/public_app.py prepare --source "$RUNNER_TEMP/source" --output "$RUNNER_TEMP/prepared"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: public-app
        path: ${{ runner.temp }}/prepared/
        if-no-files-found: error
        retention-days: 1
        include-hidden-files: true
  publish:
    needs:
    - plan
    - quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: public-app
        path: ${{ runner.temp }}/prepared
    - name: Comprobar recibo y vigencia del espejo
      env:
        MIRROR_READ_TOKEN: ${{ secrets.MIRROR_READ_TOKEN }}
      run: python3 .github/ha-images/public_app.py check --output "$RUNNER_TEMP/prepared"
    - name: Publicar solo en este repositorio
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 .github/ha-images/public_app.py publish --output "$RUNNER_TEMP/prepared"
