name: Publicar versión para Marketplace

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - '.github/workflows/release.yaml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Cada etiqueta tiene su cola: una versión anterior no bloquea las siguientes.
  group: marketplace-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'Gente-del-Condado/jacksignal-ha'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar la revisión publicada
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validar la etiqueta contra la integración
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(jq -er '.version' custom_components/jacksignal/manifest.json)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo '::error::Se requiere una versión estable X.Y.Z'; exit 1; }
          tag="v$version"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo '::error::La etiqueta no coincide con manifest.json'
            exit 1
          fi
          # A mirror may deliver the branch before its tag; allow that short delay.
          for attempt in 1 2 3 4; do
            git fetch origin "refs/tags/$tag:refs/tags/$tag" && break
            if [ "$attempt" == 4 ]; then exit 1; fi
            sleep 5
          done
          git rev-parse --verify "refs/tags/$tag^{commit}" >/dev/null
          git diff --exit-code "$tag" HEAD -- custom_components/jacksignal hacs.json
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publicar release sin modificar las etiquetas replicadas
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "La release $TAG ya existe." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          printf 'JackSignal %s para Home Assistant.\n\nInstala esta versión desde Marketplace y sigue el aviso de reinicio que muestre Home Assistant.\n\n[Guía de uso](https://github.com/Gente-del-Condado/jacksignal-ha/tree/%s)\n' "$VERSION" "$TAG" > "$RUNNER_TEMP/release-notes.md"
          if [ -f CHANGELOG.md ]; then
            awk -v version="$VERSION" '$0 == "## " version {found=1; next} found && /^## / {exit} found {print}' CHANGELOG.md >> "$RUNNER_TEMP/release-notes.md"
          fi
          # Una ejecución manual y el push de etiqueta pueden coincidir.
          gh release create "$TAG" --verify-tag --title "JackSignal $VERSION" --notes-file "$RUNNER_TEMP/release-notes.md" || gh release view "$TAG" >/dev/null
          echo "Release $TAG publicada para Marketplace." >> "$GITHUB_STEP_SUMMARY"
