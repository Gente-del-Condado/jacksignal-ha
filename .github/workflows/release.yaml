name: Publicar versión para Marketplace

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: marketplace-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'Gente-del-Condado/jacksignal-ha'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar la revisión publicada
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validar la etiqueta contra la integración
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(jq -er '.version' custom_components/jacksignal/manifest.json)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo '::error::Se requiere una versión estable X.Y.Z'; exit 1; }
          tag="v$version"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo '::error::La etiqueta no coincide con manifest.json'
            exit 1
          fi
          git rev-parse --verify "refs/tags/$tag^{commit}" >/dev/null
          git diff --exit-code "$tag" HEAD -- custom_components/jacksignal hacs.json
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publicar release sin modificar las etiquetas replicadas
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "La release $TAG ya existe." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          printf 'JackSignal %s para Home Assistant.\n\nInstala esta versión desde Marketplace/HACS y reinicia Home Assistant.\n\n[Guía de uso](https://github.com/Gente-del-Condado/jacksignal-ha/tree/%s)\n' "$VERSION" "$TAG" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$TAG" --verify-tag --title "JackSignal $VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
          echo "Release $TAG publicada para Marketplace." >> "$GITHUB_STEP_SUMMARY"
