name: Cancelar ejecución antigua 43088065288
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cleanup-stuck-run.yaml']
permissions:
  actions: write
jobs:
  cancel:
    if: github.repository == 'Gente-del-Condado/jacksignal-ha'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Cancelar únicamente la ejecución antigua y verificar
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          endpoint='repos/Gente-del-Condado/jacksignal-ha/actions/runs/43088065288'
          state=$(gh api "$endpoint")
          [[ $(jq -r '.head_sha' <<< "$state") == 378caf198b21fcd1ab26f7853cd562a51e095036 ]]
          [[ $(jq -r '.run_number' <<< "$state") == 20 ]]
          if [[ $(jq -r '.status' <<< "$state") != completed ]]; then
            gh api --method POST "$endpoint/force-cancel"
          fi
          for attempt in {1..12}; do
            state=$(gh api "$endpoint")
            if [[ $(jq -r '.status' <<< "$state") == completed ]]; then
              jq -r '"Ejecución \(.id): \(.status), \(.conclusion)."' <<< "$state" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo 'No se ha confirmado la cancelación' >&2
          exit 1
